name: Validate Solid useMutation client switch

on:
  push:
    branches:
      - validation/solid-usemutation-36990bef

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'dijedontahiri/query'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: d346e85f0144eb9b991e6e1665b22f4574de9751
      ORIGINAL_CANDIDATE_SHA: 36990befc39232df24b016b204d393f6d412487d
      CANDIDATE_SHA: 0606ea9da15f4f8fbc761ffb0aca6593729d6b48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$ORIGINAL_CANDIDATE_SHA^{commit}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Baseline negative control
        shell: bash
        run: |
          source=packages/solid-query/src/useMutation.ts
          trap 'git checkout "$CANDIDATE_SHA" -- "$source"' EXIT
          git show "$BASE_SHA:$source" > "$source"
          set +e
          pnpm nx run @tanstack/solid-query:test:lib --skip-nx-cache -- useMutation.queryClient.test.tsx --run --reporter=json --outputFile=/tmp/base.json > /tmp/base.log 2>&1
          code=$?
          set -e
          cat /tmp/base.log
          test "$code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/base.json').read_text())
          assertions={a['title']:a['status'] for a in r['testResults'][0]['assertionResults']}
          assert assertions['should use the current queryClient after the accessor changes']=='failed', assertions
          assert assertions['should stop retained per-call callbacks when the component unmounts']=='passed', assertions
          PY
          git show "$ORIGINAL_CANDIDATE_SHA:$source" > "$source"
          set +e
          pnpm nx run @tanstack/solid-query:test:lib --skip-nx-cache -- useMutation.queryClient.test.tsx --run --reporter=json --outputFile=/tmp/review.json > /tmp/review.log 2>&1
          review_code=$?
          set -e
          cat /tmp/review.log
          test "$review_code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/review.json').read_text())
          assertions={a['title']:a['status'] for a in r['testResults'][0]['assertionResults']}
          assert assertions['should use the current queryClient after the accessor changes']=='passed', assertions
          assert assertions['should preserve per-call callbacks for an in-flight mutation after switching clients']=='failed', assertions
          assert assertions['should stop retained per-call callbacks when the component unmounts']=='passed', assertions
          PY
          git checkout "$CANDIDATE_SHA" -- "$source"
      - name: Focused regression on final tree
        run: pnpm nx run @tanstack/solid-query:test:lib --skip-nx-cache -- useMutation.queryClient.test.tsx
      - name: Solid Query full validation
        run: |
          pnpm nx run @tanstack/solid-query:test:lib --skip-nx-cache
          pnpm nx run @tanstack/solid-query:test:types --skip-nx-cache
          pnpm nx run @tanstack/solid-query:test:eslint --skip-nx-cache
          pnpm nx run @tanstack/solid-query:build --skip-nx-cache
          pnpm nx run @tanstack/solid-query:test:build --skip-nx-cache
      - name: Generated docs audit
        run: |
          pnpm run generate-docs
          git diff --exit-code
      - name: Affected validation
        run: pnpm run test:pr --base="$BASE_SHA" --head="$CANDIDATE_SHA" --skip-nx-cache --parallel=2
      - name: Diff and formatting audit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA...$CANDIDATE_SHA")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx '.changeset/solid-mutation-client-switch.md'
          printf '%s\n' "${files[@]}" | grep -Fx 'packages/solid-query/src/__tests__/useMutation.queryClient.test.tsx'
          printf '%s\n' "${files[@]}" | grep -Fx 'packages/solid-query/src/useMutation.ts'
          pnpm prettier --experimental-cli --check .changeset/solid-mutation-client-switch.md packages/solid-query/src/__tests__/useMutation.queryClient.test.tsx packages/solid-query/src/useMutation.ts
