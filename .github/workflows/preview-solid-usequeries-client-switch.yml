name: Preview Solid useQueries client switch
on:
  push:
    branches: [validate/preview-solid-usequeries-client-switch-20260919]
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'dijedontahiri/query'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f24304de937bf23fc65a2d13179009061514d3d4
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: |
          npm install --global pnpm@11.1.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/solid-query/src/useQueries.ts packages/solid-query/src/__tests__/useQueries.queryClient.test.tsx .changeset/solid-queries-client-switch.md
          pnpm run generate-docs > /tmp/generate-docs.log 2>&1 || { tail -n 200 /tmp/generate-docs.log; exit 1; }
          git diff --check
          git diff -- packages/solid-query/src/useQueries.ts packages/solid-query/src/__tests__/useQueries.queryClient.test.tsx .changeset/solid-queries-client-switch.md docs/framework/solid/reference
