name: Preview Solid useMutation formatting
on:
  push:
    branches: [validate/format-solid-usemutation-20260919]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'dijedontahiri/query'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f606a30c0894782a6e5b16d72f81d668f72a620
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: |
          npm install --global pnpm@11.1.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/solid-query/src/useMutation.ts
          git diff -- packages/solid-query/src/useMutation.ts
