name: Repair Solid useMutation subscription type

on:
  push:
    branches:
      - repair/solid-usemutation-subscription-type-20260919

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'dijedontahiri/query'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/solid-usemutation-queryclient-switch
      EXPECTED_HEAD: a7fbcca77e452963349e5f8ab587c6ea0bf9bb03
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact target head
        shell: bash
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git checkout --detach "$EXPECTED_HEAD"
      - name: Apply focused type correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/solid-query/src/useMutation.ts')
          text = path.read_text()
          old = '    let release = noop\n'
          new = '    let release: () => void = noop\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- packages/solid-query/src/useMutation.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repair before publication
        run: |
          pnpm nx run @tanstack/solid-query:test:lib --skip-nx-cache -- useMutation.queryClient.test.tsx
          pnpm nx run @tanstack/solid-query:test:types --skip-nx-cache
          pnpm nx run @tanstack/solid-query:test:eslint --skip-nx-cache
      - name: Commit and fast-forward push
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/solid-query/src/useMutation.ts
          git commit -m 'fix(solid-query): type retained mutation subscription cleanup'
          git push origin HEAD:"$TARGET_BRANCH"
