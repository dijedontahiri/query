name: Capture Vue generated docs
on:
  push:
    branches: [validate/vue-infinite-initial-data-20260918]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'dijedontahiri/query'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NX_DAEMON: false
      NX_NO_CLOUD: true
      NX_TUI: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d0a4a8f15a1dafe6db4fa9c1c705e6a3fd9f9fac
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          test "$(git rev-parse HEAD)" = d0a4a8f15a1dafe6db4fa9c1c705e6a3fd9f9fac
      - name: Generate and capture exact changed reference docs
        run: |
          pnpm run generate-docs
          git diff --name-only > /tmp/generated-files.txt
          test "$(wc -l < /tmp/generated-files.txt)" -eq 3
          grep -Fx 'docs/framework/vue/reference/functions/infiniteQueryOptions.md' /tmp/generated-files.txt
          grep -Fx 'docs/framework/vue/reference/type-aliases/DefinedInitialDataInfiniteOptions.md' /tmp/generated-files.txt
          grep -Fx 'docs/framework/vue/reference/type-aliases/UndefinedInitialDataInfiniteOptions.md' /tmp/generated-files.txt
          mkdir -p /tmp/generated-docs
          while IFS= read -r file; do
            mkdir -p "/tmp/generated-docs/$(dirname "$file")"
            cp "$file" "/tmp/generated-docs/$file"
          done < /tmp/generated-files.txt
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('/tmp/generated-docs').rglob('*.md'):
              text = path.read_text()
              path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + ('\n' if text.endswith('\n') else ''))
          PY
          grep -n 'optional initialData:' /tmp/generated-docs/docs/framework/vue/reference/type-aliases/UndefinedInitialDataInfiniteOptions.md
          git diff --check || true
      - name: Upload generated reference docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vue-generated-reference-docs
          path: /tmp/generated-docs
          retention-days: 14
